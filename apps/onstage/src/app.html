<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<!-- viewport-fit=cover: 노치·홈 바가 있는 폰에서 화면 끝까지 쓰고, 가려지는 곳은 env(safe-area-inset-*)로 비운다. -->
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<!-- 주소창·홈 화면 앱 상단 막대 색. 배경(zinc-50 / zinc-950)과 같게 둔다. -->
		<meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)" />
		<!-- 홈 화면에 추가했을 때(iPhone) 앱처럼 열리게 한다. 설치 정보는 [[lang=lang]]/+layout.svelte의 manifest 링크. -->
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="SCLS" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icons/apple-touch-icon.png" />
		<!-- nonce: 콘텐츠 보안 정책(CSP, vite.config.ts)이 이 인라인 스크립트만 허용하도록 SvelteKit이 채운다. -->
		<script nonce="%sveltekit.nonce%">
			// 테마 결정은 body가 그려지기 전, 되도록 이르게 해야 깜빡임(FOUC)이 없다.
			// localStorage에 명시적 선택(light/dark)이 없으면 "시스템" 취급 — OS 설정을 그대로 따른다.
			(function () {
				var stored = localStorage.getItem('theme');
				var theme =
					stored === 'light' || stored === 'dark'
						? stored
						: window.matchMedia('(prefers-color-scheme: dark)').matches
							? 'dark'
							: 'light';
				document.documentElement.setAttribute('data-theme', theme);
				// 직접 고른 화면 모드가 있으면 상단 막대 색도 그 모드에 맞춘다(src/lib/theme.ts의 applyThemeColor와 같은 규칙).
				// theme-color 메타는 이 스크립트보다 위에 있어서 바로 찾을 수 있다.
				if (stored === 'light' || stored === 'dark') {
					var metas = document.querySelectorAll('meta[name="theme-color"]');
					for (var i = 0; i < metas.length; i++) {
						metas[i].setAttribute('content', stored === 'dark' ? '#09090b' : '#fafafa');
					}
				}
			})();
		</script>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
		<link
			href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700;800&display=swap"
			rel="stylesheet"
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
